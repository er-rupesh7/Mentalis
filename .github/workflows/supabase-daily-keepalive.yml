name: Supabase Daily Keep-Alive & Platform Pulse

on:
  schedule:
    # Runs twice daily at 04:17 UTC and 16:17 UTC (9:47 AM & 9:47 PM IST)
    # Staggered minute (17) avoids GitHub Actions runner congestion at top of the hour
    - cron: '17 4,16 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

concurrency:
  group: supabase-keepalive
  cancel-in-progress: true

jobs:
  database-health-pulse:
    name: Database Pulse & Health Maintenance
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fast Install Supabase Client
        run: npm install @supabase/supabase-js --no-save --prefer-offline || true

      - name: Execute Database Maintenance & Keep-Alive Pulse
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/daily-db-maintenance.mjs
