<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060d" />
      <stop offset="50%" stop-color="#090d1e" />
      <stop offset="100%" stop-color="#0f152d" />
    </linearGradient>

    <!-- Glowing Neon Border Gradient -->
    <linearGradient id="neonBorder" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#6366f1" />
      <stop offset="80%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Brain Icon Stroke Gradient -->
    <linearGradient id="brainStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ede9fe" />
      <stop offset="50%" stop-color="#c4b5fd" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>

    <!-- Subtle Outer Glow for Border -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Inner Shadow / Vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6" />
    </radialGradient>
  </defs>

  <!-- Squircle Base with Glow -->
  <rect
    x="24"
    y="24"
    width="464"
    height="464"
    rx="116"
    fill="url(#bgGrad)"
  />

  <!-- Subtle Vignette -->
  <rect
    x="24"
    y="24"
    width="464"
    height="464"
    rx="116"
    fill="url(#vignette)"
  />

  <!-- Glowing Neon Border -->
  <rect
    x="24"
    y="24"
    width="464"
    height="464"
    rx="116"
    fill="none"
    stroke="url(#neonBorder)"
    stroke-width="22"
    filter="url(#neonGlow)"
  />

  <!-- Exact Lucide Brain Icon Geometry (Normalized to 512x512 Canvas) -->
  <!-- Original Lucide viewBox: 0 0 24 24 -> Scale = 13.5, Translate to Center = (94, 94) -->
  <g
    transform="translate(94, 94) scale(13.5)"
    stroke="url(#brainStroke)"
    stroke-width="1.8"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  >
    <!-- Left Hemisphere -->
    <path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z" />
    <!-- Right Hemisphere -->
    <path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z" />
    <!-- Center Crease & Cortex Curves -->
    <path d="M15 13a4.5 4.5 0 0 1-3-4 4.5 4.5 0 0 1-3 4" />
    <path d="M17.599 6.5a3 3 0 0 0 .399-1.375" />
    <path d="M6.003 5.125A3 3 0 0 0 6.401 6.5" />
    <path d="M3.477 10.896a4 4 0 0 1 .585-.396" />
    <path d="M19.938 10.5a4 4 0 0 1 .585.396" />
    <path d="M6 18a4 4 0 0 1-1.967-.516" />
    <path d="M19.967 17.484A4 4 0 0 1 18 18" />
  </g>
</svg>
